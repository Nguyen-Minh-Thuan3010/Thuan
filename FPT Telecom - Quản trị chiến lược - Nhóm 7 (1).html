<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FPT Telecom - Quản trị chiến lược - Nhóm 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--page:#e6e3d3;--navy:#243b6b;--or:#f47920;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#14161c}}
:root[data-theme="dark"]{--page:#14161c}
html,body{height:100%;margin:0}
body{background:var(--page);display:grid;place-items:center;font-family:"Montserrat",Arial,Helvetica,sans-serif;overflow:hidden}
.deck{position:relative;width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;container-type:inline-size;overflow:hidden;background:#f7f4e6;box-shadow:0 1cqw 4cqw rgba(0,0,0,.25)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arc{position:absolute;border:.12cqw solid #38bdf8;border-radius:50%;opacity:.7;animation:sw 16s ease-in-out infinite}
.a1{width:46cqw;height:46cqw;left:-4cqw;top:-46cqw}.a2{width:30cqw;height:30cqw;left:-16cqw;top:34cqw;animation-direction:reverse}
@keyframes sw{50%{transform:translate(2cqw,1.5cqw) scale(1.06)}}
.deck[data-i="0"] :is(.arc,.logo),.deck[data-i="13"] :is(.arc,.logo){display:none}
.logo{position:absolute;right:2.4cqw;top:2.4cqw;z-index:3;display:flex;align-items:center;gap:.5cqw;padding:.8cqw 1.8cqw;border:.1cqw solid #bae6fd;border-radius:3.4cqw;background:rgba(255,255,255,.55);font-weight:900;font-size:2.4cqw;font-style:italic;animation:glow 3s ease-in-out infinite}
.lg{display:inline-flex;align-items:center;gap:.4cqw;font-weight:900;font-style:italic}
.lg i{display:grid;place-items:center;width:1.1em;height:1.25em;color:#fff;border-radius:.12em;transform:skewX(-8deg)}
.lg small{font-size:.68em;font-style:normal;font-weight:700;color:#1d5fa8;margin-left:.3em}
@keyframes glow{50%{box-shadow:0 0 1.6cqw rgba(56,189,248,.55)}}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;z-index:2}
.slide.on{opacity:1;visibility:visible}
h1{position:absolute;left:3.2cqw;top:4.6cqw;margin:0;font-size:3.4cqw;color:var(--navy)}
h1.b{color:#0b86d6}
h1.long{width:64cqw;font-size:2.5cqw;line-height:1.35;top:4cqw}
.on h1{animation:title 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes title{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateX(-2cqw)}to{opacity:1;clip-path:inset(0 0 0 0)}}
.cards{position:absolute;left:3.2cqw;right:3.2cqw;top:17.5cqw;bottom:6.6cqw;display:flex;align-items:stretch;gap:3.2cqw}
.card{flex:1;position:relative;background:#fff;border-radius:1.8cqw;padding:2.2cqw 2.5cqw;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12);overflow:hidden;opacity:0;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-.5cqw);box-shadow:0 .8cqw 2cqw rgba(0,0,0,.2)}
.card::before{content:"";position:absolute;left:0;top:0;height:.55cqw;width:100%;background:var(--c);transform-origin:left}
.card::after{content:"";position:absolute;top:0;left:-40%;width:30%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg)}
.on .card{animation:rise .9s cubic-bezier(.2,.8,.2,1) .5s both}
.on .card~.card,.on .arrow~.card{animation-delay:.9s}
.on .card::before{animation:bar 1s ease-out 1s both}
.on .card::after{animation:shine 1.2s ease-out 2.4s both}
@keyframes rise{from{opacity:0;transform:translateY(4cqw)}to{opacity:1;transform:none}}
@keyframes bar{from{transform:scaleX(0)}}
@keyframes shine{to{left:130%}}
.head{display:flex;align-items:center;gap:1.4cqw;margin-bottom:2cqw}
.ico{width:4.4cqw;height:4.4cqw;flex:none;border-radius:1.2cqw;display:grid;place-items:center;font-size:2.2cqw;background:color-mix(in srgb,var(--c) 10%,#fff)}
.on .ico{animation:pop .7s cubic-bezier(.3,1.6,.5,1) 1.2s both}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.tag{display:inline-block;padding:.3cqw 1cqw;border-radius:.8cqw;font-size:1.3cqw;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);margin-bottom:.5cqw}
h2{margin:0;font-size:1.9cqw;color:#0f172a}
.solo{display:flex;align-items:center}
ul{list-style:none;margin:0;padding:0}
li{position:relative;padding-left:2.6cqw;margin-bottom:1.4cqw;font-size:1.36cqw;line-height:1.6;font-weight:700;color:var(--c);opacity:0}
li::before{content:var(--m,"✔");position:absolute;left:0;top:.1cqw;font-size:1.2cqw}
.on li{animation:inl .6s ease-out calc(1.4s + var(--i)*.5s) both}
@keyframes inl{from{opacity:0;transform:translateX(-1.6cqw)}to{opacity:1;transform:none}}
.arrow{align-self:center;width:4.4cqw;height:4.4cqw;flex:none;margin:0 -1.7cqw;border-radius:50%;background:#fff;box-shadow:0 .2cqw .8cqw rgba(0,0,0,.3);display:grid;place-items:center;font-size:2.2cqw;z-index:2;opacity:0}
.on .arrow{animation:rise .6s ease 1.3s both,nudge 1.6s ease-in-out 2s infinite}
@keyframes nudge{50%{transform:translateX(.6cqw)}}
.line{position:absolute;left:1.6cqw;right:1.6cqw;bottom:5.2cqw;height:.15cqw;background:#3b3b3b;z-index:2;transform-origin:left;animation:bar 1.2s ease-out both}
/* cover */
.cv0{background:#fff}
.cover-decor{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 70% 54%,rgba(56,189,248,.07),transparent 30%),radial-gradient(ellipse at 20% 75%,rgba(244,121,32,.05),transparent 34%),repeating-linear-gradient(135deg,transparent 0 10cqw,rgba(36,59,107,.018) 10.1cqw 10.2cqw)}
.cover-decor .orbit{position:absolute;right:8cqw;top:18cqw;width:18cqw;height:18cqw;border:.1cqw solid rgba(56,189,248,.27);border-radius:50%;animation:coverOrbit 24s linear infinite}
.cover-decor .o2{right:6.8cqw;top:16.5cqw;width:20cqw;height:20cqw;border:.08cqw dashed rgba(244,121,32,.2);animation-direction:reverse;animation-duration:32s}
.cover-decor .orbit::before{content:"";position:absolute;left:15%;top:10%;width:.8cqw;height:.8cqw;border-radius:50%;background:#38bdf8;box-shadow:0 0 1.2cqw rgba(56,189,248,.8)}
.cover-decor .o2::before{left:auto;top:auto;right:14%;bottom:12%;background:#f47920;box-shadow:0 0 1.2cqw rgba(244,121,32,.75)}
.cover-decor .spark{position:absolute;width:.48cqw;height:.48cqw;border-radius:50%;background:#38bdf8;box-shadow:0 0 .65cqw rgba(56,189,248,.42);animation:coverFloat 3.8s ease-in-out infinite alternate}
.cover-decor .s1{left:8cqw;top:19cqw}.cover-decor .s2{left:48cqw;top:17cqw;animation-delay:.7s;background:#f47920}.cover-decor .s3{left:43cqw;bottom:8cqw;animation-delay:1.3s}.cover-decor .s4{right:42cqw;bottom:7cqw;animation-delay:1.8s;background:#f47920}
.ctl,.ct,.ring{z-index:2}
@keyframes coverOrbit{to{transform:rotate(360deg)}}
@keyframes coverFloat{to{transform:translate3d(0,-1.2cqw,0);opacity:.45}}
.w1{position:absolute;right:-6cqw;top:-6cqw;width:48cqw;height:68cqw;background:var(--or);transform:skewX(-14deg)}
.w2{position:absolute;left:-8cqw;bottom:-4cqw;width:30cqw;height:10cqw;background:#1b2a5a;transform:skewX(-14deg) rotate(0)}
.w3{position:absolute;right:20cqw;top:-8cqw;width:26cqw;height:8cqw;background:#1b2a5a;transform:skewX(-14deg)}
.on .w1{animation:slr 1s cubic-bezier(.2,.8,.2,1) both}.on .w2{animation:sll 1s .2s both}.on .w3{animation:sld 1s .3s both}
@keyframes slr{from{transform:translateX(30cqw) skewX(-14deg)}}@keyframes sll{from{transform:translateX(-30cqw) skewX(-14deg)}}@keyframes sld{from{transform:translateY(-12cqw) skewX(-14deg)}}
.ct{position:absolute;left:5cqw;top:16cqw;width:52cqw;text-align:center}
.ct h3{margin:0;color:var(--or);font-size:2.55cqw;line-height:1.35;font-weight:900}
.ct p{margin:1.4cqw 0 0;color:#0b6fb8;font-weight:700;font-size:1.15cqw;line-height:1.7}
.on .ct h3{animation:title 1.2s .4s both}.on .ct p{animation:rise 1s 1.2s both}
.ring{position:absolute;right:6cqw;top:12cqw;width:30cqw;height:30cqw;border-radius:50%;border:.7cqw solid #fff;background:#fff;display:grid;place-items:center;font-size:5.4cqw;box-shadow:0 1cqw 3cqw rgba(0,0,0,.3)}
.ring::after{content:"";position:absolute;inset:-2cqw;border-radius:50%;border:.25cqw dashed #fff;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.on .ring{animation:pop 1s .6s cubic-bezier(.3,1.4,.5,1) both}
.ctl{position:absolute;left:3cqw;top:3cqw;font-size:4.4cqw}
/* members */
.mem{position:absolute;left:3.2cqw;right:3.2cqw;top:17cqw;display:grid;grid-template-columns:repeat(6,1fr);gap:2.4cqw}
.m{grid-column:span 2;display:flex;align-items:center;gap:1.4cqw;background:#fff;border-radius:1.4cqw;padding:2cqw;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12);opacity:0}
.m:nth-child(4){grid-column:2/4}.m:nth-child(5){grid-column:4/6}
.m .ico{background:#e0f2fe;font-size:2cqw}
.m b{display:block;font-size:1.5cqw;color:#0f172a}.m span{font-size:1.15cqw;color:#0b86d6;font-weight:700}
.on .m{animation:rise .7s calc(.5s + var(--i)*.18s) both}
/* intro + pestel */
.environment-title{max-width:62cqw;font-size:3cqw;line-height:1.2}
.environment-photo{position:absolute;right:3.4cqw;top:8.8cqw;width:24cqw;height:17.5cqw;margin:0;padding:.35cqw;border:.12cqw solid rgba(36,59,107,.2);border-radius:1.1cqw;background:#fff;box-shadow:0 .45cqw 1.4cqw rgba(15,35,60,.2);overflow:hidden;opacity:0;cursor:zoom-in}
.environment-photo:focus-visible{outline:.2cqw solid #1671f5;outline-offset:.25cqw}
.environment-photo img{width:100%;height:100%;display:block;object-fit:cover;border-radius:.7cqw}
.environment-photo figcaption{position:absolute;left:.35cqw;right:.35cqw;bottom:.35cqw;padding:.55cqw .8cqw;border-radius:0 0 .65cqw .65cqw;background:linear-gradient(transparent,rgba(8,28,54,.88));color:#fff;font-size:.82cqw;font-weight:700}
.on .environment-photo{animation:rise .8s .25s ease-out both}
.environment-cards{top:27.5cqw}
.image-lightbox{position:fixed;max-width:94vw;max-height:94vh;width:max-content;padding:1.1rem;border:1px solid rgba(255,255,255,.55);border-radius:1rem;background:#101827;color:#fff;box-shadow:0 1rem 4rem rgba(0,0,0,.5);overflow:visible}
.image-lightbox[open]{animation:lightboxIn .2s ease-out both}
.image-lightbox::backdrop{background:rgba(5,12,24,.82);backdrop-filter:blur(5px)}
.image-lightbox img{display:block;width:min(78vw,1200px);max-width:88vw;max-height:82vh;object-fit:contain;border-radius:.5rem}
.image-lightbox p{margin:.8rem 2.8rem 0 0;font-size:.95rem;font-weight:700}
.image-lightbox button{position:absolute;top:.35rem;right:.35rem;width:2.5rem;height:2.5rem;border:1px solid rgba(255,255,255,.6);border-radius:50%;background:#fff;color:#10294d;font-size:1.6rem;line-height:1;cursor:pointer}
@keyframes lightboxIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
.int{position:absolute;left:4cqw;top:14cqw;width:40cqw;font-size:3.7cqw;line-height:1.25;font-weight:900;color:var(--or)}
.on .int{animation:title 1.1s .3s both}
.video-frame{position:absolute;right:8cqw;top:8cqw;width:30cqw;height:41cqw;padding:.55cqw;border-radius:2cqw;background:linear-gradient(145deg,#38bdf8,#2563eb 38%,#f47920 78%,#fbbf24);box-shadow:0 1cqw 3cqw rgba(15,45,90,.28),0 0 2cqw rgba(56,189,248,.26);overflow:hidden}
.video-frame::before{content:"";position:absolute;inset:.2cqw;border:1px solid rgba(255,255,255,.65);border-radius:1.65cqw;pointer-events:none;z-index:2}
.video-frame::after{content:"";position:absolute;left:-30%;right:-30%;top:-25%;height:35%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.16),transparent);transform:rotate(-12deg);animation:vscan 4s ease-in-out infinite;pointer-events:none;z-index:2}
.video-frame video{display:block;width:100%;height:100%;border-radius:1.5cqw;background:#101827;object-fit:cover}
.video-label{position:absolute;left:1.5cqw;top:1.5cqw;z-index:3;padding:.55cqw 1cqw;border:1px solid rgba(255,255,255,.45);border-radius:2cqw;background:rgba(12,35,68,.72);backdrop-filter:blur(8px);color:#fff;font-size:1cqw;font-weight:800;letter-spacing:.08em}
@keyframes vscan{0%,20%{transform:translateY(-15cqw) rotate(-12deg);opacity:0}45%{opacity:1}80%,100%{transform:translateY(60cqw) rotate(-12deg);opacity:0}}
@keyframes pulse{from{transform:scale(.4);opacity:.6}to{transform:scale(1.2);opacity:0}}
.on .video-frame{animation:rise 1s .5s both,videoGlow 3.2s ease-in-out 1.5s infinite alternate}
@keyframes videoGlow{to{box-shadow:0 1.2cqw 3.5cqw rgba(15,45,90,.36),0 0 2.8cqw rgba(56,189,248,.5)}}
.pl{position:absolute;left:3.2cqw;right:3.2cqw;top:25cqw;display:flex;gap:1.8cqw}
.pl::before{content:"";position:absolute;left:2cqw;right:2cqw;top:-2.6cqw;height:.25cqw;background:#38bdf8;transform-origin:left}
.on .pl::before{animation:bar 2s .4s ease-out both}
.p{flex:1;background:#fff;border-radius:1.4cqw;padding:2cqw 1.2cqw;text-align:center;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12);border-top:.5cqw solid var(--c);opacity:0;transition:transform .3s}
.p:hover{transform:translateY(-.7cqw)}
.p em{display:grid;place-items:center;width:3.6cqw;height:3.6cqw;margin:0 auto 1.2cqw;border-radius:50%;background:var(--c);color:#fff;font-style:normal;font-weight:700;font-size:1.8cqw}
.p b{font-size:1.45cqw;color:#0f172a;line-height:1.4}.p div{font-size:2.4cqw;margin-top:1cqw}
.on .p{animation:rise .7s calc(.6s + var(--i)*.25s) both}
/* section + thanks */
.big{position:absolute;left:0;right:0;top:20cqw;text-align:center;color:var(--navy);font-family:"Montserrat",Arial,Helvetica,sans-serif;font-size:clamp(2rem,4cqw,4.4rem);font-weight:900;line-height:1.15;padding:0 8cqw}
.on .big{animation:title 1.2s .3s both}
.tg{position:absolute;left:50%;top:12cqw;width:8cqw;height:8cqw;margin-left:-4cqw;font-size:4.4cqw;display:grid;place-items:center}
.tg::before,.tg::after{content:"";position:absolute;inset:0;border-radius:50%;border:.3cqw solid #2563eb;animation:pulse 2.4s ease-out infinite}.tg::after{animation-delay:1.2s}
.th{background:#fff}
.th .big{color:var(--or);font-size:6.4cqw;top:22cqw}
.th small{position:absolute;left:0;right:0;text-align:center;font-weight:700;color:#0b6fb8;font-size:2cqw;opacity:0}
.on .th small{animation:rise .8s 1s both}
/* table */
.sub{position:absolute;left:3.2cqw;top:8cqw;font-size:1.1cqw;color:#475569;font-weight:700}
.tbl{position:absolute;left:3.2cqw;top:10.6cqw;width:calc(100% - 6.4cqw);border-collapse:collapse;font-size:1cqw;background:#fff;box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12)}
.tbl th,.tbl td{padding:.5cqw .5cqw;text-align:center;border-bottom:.08cqw solid #e5e7eb}
.tbl td:first-child,.tbl th:first-child{text-align:left;font-weight:700;color:#0f172a;padding-left:1cqw}
.tbl th{background:#243b6b;color:#fff;font-size:.95cqw}.tbl th.g{background:var(--c);font-size:1.15cqw}.tbl th,.tbl th:first-child{color:#fff}.tbl tr:nth-child(2) th:first-child{text-align:center;padding-left:.5cqw}
.tbl tr{opacity:0}.on .tbl tr{animation:inl .5s ease-out calc(.5s + var(--i)*.12s) both}
.tbl tr:hover td{background:#f1f5f9}
.tbl .tt td{font-weight:700;background:#f8fafc;position:relative}
.bar{display:block;height:.45cqw;margin-top:.3cqw;background:var(--c);border-radius:.3cqw;width:0}
.on .bar{animation:grow 1.4s 2.6s ease-out both}
@keyframes grow{to{width:var(--w)}}
.best{color:#dc2626}
.efe-wrap{position:absolute;inset:7.4cqw 1.6cqw 5.8cqw;background:#fff;border:.12cqw solid rgba(36,59,107,.2);border-radius:.7cqw;overflow:hidden;box-shadow:0 .25cqw .9cqw rgba(0,0,0,.12)}
.efe{width:100%;height:100%;table-layout:fixed;border-collapse:collapse;font-size:.7cqw;line-height:1.12;color:#172033}
.efe th,.efe td{padding:.23cqw .4cqw;border:1px solid #d7dee8;text-align:left;vertical-align:middle}
.efe .efe-title th{height:3.2cqw;background:#073b70;color:#fff;text-align:center;font-size:1.12cqw;font-weight:900;letter-spacing:.025em}
.efe .efe-head th{background:#1671f5;color:#fff;text-align:center;font-size:.78cqw;font-weight:800}
.efe .efe-group td{height:2.2cqw;text-align:center;font-weight:900;font-size:.78cqw;letter-spacing:.04em}
.efe .efe-opportunity td{background:#d4e9e1;color:#155e43}
.efe .efe-threat td{background:#f8d9dc;color:#9f2631}
.efe .efe-data td:first-child{font-weight:600}
.efe .efe-data a{color:inherit;text-decoration:underline;text-decoration-color:rgba(22,113,245,.45);text-underline-offset:.12em}
.efe .efe-data a:hover{color:#075fc9;text-decoration-color:currentColor}
.efe .efe-data td:nth-child(2),.efe .efe-data td:nth-child(3),.efe .efe-data td:nth-child(4){text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.efe .efe-total td{height:2.8cqw;background:#073b70;color:#fff;font-weight:900}
.efe .efe-total td:nth-child(2),.efe .efe-total td:nth-child(4){text-align:center}
.on .efe tr{animation:inl .45s ease-out calc(.15s + var(--i)*.055s) both}
.cpm-intro{position:absolute;inset:0;background:#111;overflow:hidden}
.cpm-photo{position:absolute;left:2.4cqw;top:5.2cqw;bottom:0;width:40.2cqw;border:.18cqw solid #8b35ff;overflow:hidden;box-shadow:0 0 1.8cqw rgba(139,53,255,.32)}
.cpm-photo img{width:100%;height:100%;display:block;object-fit:cover;animation:cpmPhoto 1.1s cubic-bezier(.2,.8,.2,1) both}
.cpm-panel{position:absolute;left:44.2cqw;right:1.2cqw;top:0;bottom:0;padding:9cqw 4cqw 4cqw;background:linear-gradient(145deg,rgba(250,249,239,.98),rgba(247,244,230,.93));border-radius:5cqw 0 0 5cqw;box-shadow:-1cqw 0 3cqw rgba(0,0,0,.2);overflow:hidden}
.cpm-panel::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 55%,rgba(255,255,255,.65),transparent 65%),repeating-linear-gradient(135deg,transparent 0 7cqw,rgba(36,59,107,.025) 7.1cqw 7.2cqw);pointer-events:none}
.cpm-heading{position:relative;margin:0;text-align:center;color:var(--navy);font-size:3.1cqw;font-weight:800;line-height:1.25;letter-spacing:.015em}
.cpm-logos{position:relative;display:grid;grid-template-columns:1fr 1fr;align-items:center;justify-items:center;column-gap:2cqw;row-gap:4.7cqw;margin-top:6.4cqw}
.cpm-brand{height:8cqw;width:100%;display:flex;align-items:center;justify-content:center;white-space:nowrap;animation:cpmBrand .65s ease-out both}

// Nền mạng lưới chiến lược
const cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=cv.clientWidth;cv.height=cv.clientHeight}rs();addEventListener('resize',rs);
const N=Array.from({length:32},()=>({x:Math.random(),y:Math.random(),vx:(Math.random()-.5)*.0004,vy:(Math.random()-.5)*.0004}));
(function f(){
  const w=cv.width,h=cv.height;x.clearRect(0,0,w,h);
  for(const a of N){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>1)a.vx*=-1;if(a.y<0||a.y>1)a.vy*=-1}
  for(let a=0;a<N.length;a++)for(let b=a+1;b<N.length;b++){const d=Math.hypot((N[a].x-N[b].x)*w,(N[a].y-N[b].y)*h);
    if(d<w*.14){x.strokeStyle='rgba(36,59,107,'+.16*(1-d/(w*.14))+')';x.beginPath();x.moveTo(N[a].x*w,N[a].y*h);x.lineTo(N[b].x*w,N[b].y*h);x.stroke()}}
  x.fillStyle='rgba(37,99,235,.35)';for(const a of N){x.beginPath();x.arc(a.x*w,a.y*h,w*.0028,0,7);x.fill()}
  requestAnimationFrame(f);
})();
</script>
